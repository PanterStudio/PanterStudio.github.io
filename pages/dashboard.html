<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Studio OS v2.0 - Infinite Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-panel: #18181b;
            --primary: #8b5cf6; /* Violeta */
            --secondary: #3b82f6; /* Azul */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            
            /* Colores de Nodos */
            --node-gameplay: #f43f5e;
            --node-art: #f59e0b;
            --node-code: #3b82f6;
            --node-audio: #10b981;
            --node-marketing: #ec4899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 100;
        }

        .logo { font-size: 1.2rem; font-weight: 800; color: white; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--primary); }

        .nav-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .nav-item:hover { background-color: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), transparent); color: var(--primary); border-left: 3px solid var(--primary); }

        /* --- MAIN AREA --- */
        .main-content { flex: 1; position: relative; overflow: hidden; background-image: radial-gradient(#27272a 1px, transparent 1px); background-size: 20px 20px; }

        /* Toolbar Flotante */
        .toolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(39, 39, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            padding: 8px;
            border-radius: 50%;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .tool-btn.active { color: var(--primary); background: rgba(139, 92, 246, 0.1); }

        /* --- INFINITE CANVAS --- */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        /* --- NODES --- */
        .node {
            position: absolute;
            width: 200px;
            background: rgba(30, 30, 35, 0.9);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            transition: box-shadow 0.2s, transform 0.1s;
            user-select: none;
        }

        .node:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .node-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .node-dot { width: 8px; height: 8px; border-radius: 50%; }
        
        .node-content {
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            border: 1px solid transparent;
            padding: 2px;
            border-radius: 4px;
        }
        .node-content:focus { background: rgba(255,255,255,0.05); border-color: var(--border); }

        .node-actions {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .node:hover .node-actions { opacity: 1; }

        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:hover { background: var(--danger); }

        /* Colores Específicos por Categoría */
        .type-gameplay .node-dot { background: var(--node-gameplay); }
        .type-gameplay .node-header { color: var(--node-gameplay); }
        
        .type-art .node-dot { background: var(--node-art); }
        .type-art .node-header { color: var(--node-art); }

        .type-code .node-dot { background: var(--node-code); }
        .type-code .node-header { color: var(--node-code); }

        .type-audio .node-dot { background: var(--node-audio); }
        .type-audio .node-header { color: var(--node-audio); }

        .type-marketing .node-dot { background: var(--node-marketing); }
        .type-marketing .node-header { color: var(--node-marketing); }

        /* Zoom Indicator */
        .zoom-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--bg-panel);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo"><i class="fas fa-cube"></i> NEXUS STUDIO</div>
        
        <div class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</div>
        <div class="nav-item"><i class="fas fa-tasks"></i> Tareas</div>
        <div class="nav-item active"><i class="fas fa-project-diagram"></i> Brainstorming</div>
        <div class="nav-item"><i class="fas fa-cube"></i> Assets</div>
        <div class="nav-item"><i class="fas fa-bug"></i> QA</div>

        <div style="margin-top: auto;">
            <div class="nav-item"><i class="fas fa-cog"></i> Settings</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Toolbar -->
        <div class="toolbar">
            <button class="tool-btn" onclick="addNode('gameplay')" title="Añadir Nodo Gameplay"><i class="fas fa-gamepad"></i></button>
            <button class="tool-btn" onclick="addNode('art')" title="Añadir Nodo Arte"><i class="fas fa-paint-brush"></i></button>
            <button class="tool-btn" onclick="addNode('code')" title="Añadir Nodo Código"><i class="fas fa-code"></i></button>
            <button class="tool-btn" onclick="addNode('audio')" title="Añadir Nodo Audio"><i class="fas fa-music"></i></button>
            <button class="tool-btn" onclick="addNode('marketing')" title="Añadir Nodo Marketing"><i class="fas fa-bullhorn"></i></button>
            <div style="width: 1px; background: var(--border); margin: 0 5px;"></div>
            <button class="tool-btn" onclick="resetView()" title="Centrar Vista"><i class="fas fa-compress-arrows-alt"></i></button>
            <button class="tool-btn" onclick="clearCanvas()" title="Borrar Todo" style="color: var(--danger);"><i class="fas fa-trash"></i></button>
        </div>

        <!-- Canvas Area -->
        <div id="canvas-container">
            <!-- Los nodos se generarán aquí con JS -->
        </div>

        <div class="zoom-indicator" id="zoom-display">100%</div>
    </div>

    <script>
        // --- CONFIGURACIÓN DEL CANVAS ---
        const container = document.getElementById('canvas-container');
        const zoomDisplay = document.getElementById('zoom-display');
        
        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;

        // Datos iniciales para poblar el tablero
        const initialNodes = [
            { id: 1, type: 'gameplay', x: 100, y: 100, title: 'Mecánicas Core', text: 'Movimiento: Doble salto, Dash aéreo, Grapple hook.' },
            { id: 2, type: 'gameplay', x: 400, y: 100, title: 'Sistema de Combate', text: 'Parry, Counter-attack, Combo system.' },
            { id: 3, type: 'code', x: 100, y: 300, title: 'Arquitectura', text: 'ECS Pattern, State Machine para IA.' },
            { id: 4, type: 'code', x: 400, y: 300, title: 'Networking', text: 'Rollback netcode para multiplayer.' },
            { id: 5, type: 'art', x: 700, y: 100, title: 'Estilo Visual', text: 'Cel-shading, Paleta Cyberpunk.' },
            { id: 6, type: 'art', x: 700, y: 300, title: 'Personajes', text: 'Modelado Low-poly, Texturas 4k.' },
            { id: 7, type: 'audio', x: 100, y: 500, title: 'Banda Sonora', text: 'Synthwave / Industrial.' },
            { id: 8, type: 'marketing', x: 700, y: 500, title: 'Lanzamiento', text: 'Steam Early Access, Trailer.' },
        ];

        // --- INICIALIZACIÓN ---
        function init() {
            initialNodes.forEach(data => createNodeElement(data));
            updateTransform();
        }

        // --- LÓGICA DEL CANVAS (PAN & ZOOM) ---
        container.addEventListener('mousedown', (e) => {
            if(e.target === container || e.target.classList.contains('main-content')) {
                panning = true;
                startX = e.clientX - pointX;
                startY = e.clientY - pointY;
                container.style.cursor = 'grabbing';
            }
        });

        document.addEventListener('mouseup', () => {
            panning = false;
            container.style.cursor = 'grab';
        });

        document.addEventListener('mousemove', (e) => {
            if (!panning) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateTransform();
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            const delta = -e.deltaY;
            
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            
            // Limites de zoom
            if(scale < 0.1) scale = 0.1;
            if(scale > 3) scale = 3;

            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;

            updateTransform();
        });

        function updateTransform() {
            container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            zoomDisplay.innerText = Math.round(scale * 100) + '%';
        }

        function resetView() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            updateTransform();
        }

        // --- LÓGICA DE NODOS ---
        let nodeIdCounter = 100;

        function createNodeElement(data) {
            const node = document.createElement('div');
            node.classList.add('node', `type-${data.type}`);
            node.id = `node-${data.id}`;
            node.style.left = `${data.x}px`;
            node.style.top = `${data.y}px`;

            node.innerHTML = `
                <div class="node-header">
                    <div class="node-dot"></div>
                    ${getIcon(data.type)} ${data.title}
                </div>
                <div class="node-content" contenteditable="true">${data.text}</div>
                <div class="node-actions">
                    <button class="action-btn" onclick="deleteNode('${node.id}')"><i class="fas fa-times"></i></button>
                </div>
            `;

            // Dragging Logic for Nodes
            let isDraggingNode = false;
            let nodeStartX, nodeStartY;

            node.addEventListener('mousedown', (e) => {
                // Si estamos editando texto, no arrastrar
                if(document.activeElement === node.querySelector('.node-content')) return;
                
                isDraggingNode = true;
                nodeStartX = e.clientX - node.offsetLeft;
                nodeStartY = e.clientY - node.offsetTop;
                node.style.zIndex = 100; // Traer al frente
            });

            document.addEventListener('mouseup', () => {
                isDraggingNode = false;
                node.style.zIndex = '';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDraggingNode) return;
                e.preventDefault();
                // Calcular posición relativa al zoom actual
                const newX = (e.clientX - nodeStartX) / scale;
                const newY = (e.clientY - nodeStartY) / scale;
                
                node.style.left = `${newX}px`;
                node.style.top = `${newY}px`;
            });

            container.appendChild(node);
        }

        function addNode(type) {
            nodeIdCounter++;
            // Crear en el centro de la vista actual
            const centerX = (-pointX + (window.innerWidth / 2)) / scale;
            const centerY = (-pointY + (window.innerHeight / 2)) / scale;

            const titles = {
                'gameplay': 'Nueva Mecánica',
                'art': 'Nuevo Concepto',
                'code': 'Sistema Técnico',
                'audio': 'Efecto de Sonido',
                'marketing': 'Idea Promo'
            };

            createNodeElement({
                id: nodeIdCounter,
                type: type,
                x: centerX - 100,
                y: centerY - 50,
                title: titles[type],
                text: 'Describe tu idea aquí...'
            });
        }

        function deleteNode(id) {
            const node = document.getElementById(id);
            if(node) node.remove();
        }

        function clearCanvas() {
            if(confirm('¿Borrar todo el tablero?')) {
                container.innerHTML = '';
                nodeIdCounter = 0;
            }
        }

        function getIcon(type) {
            const icons = {
                'gameplay': '<i class="fas fa-gamepad"></i>',
                'art': '<i class="fas fa-palette"></i>',
                'code': '<i class="fas fa-terminal"></i>',
                'audio': '<i class="fas fa-volume-up"></i>',
                'marketing': '<i class="fas fa-bullhorn"></i>'
            };
            return icons[type] || '';
        }

        // Arrancar
        init();

    </script>
</body>
</html>
