<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Soporte — Panter Studio</title>
    <!--
        Este panel se UNIFICÓ en el Centro de Soporte (pages/soporte.html),
        que ya contiene tanto la creación de tickets por el usuario como la
        pestaña «Panel de Soporte» para el staff (tomar, elevar, responder,
        cerrar, bitácora y presencia en línea).

        Se conserva esta ruta como REDIRECCIÓN para no romper marcadores,
        enlaces antiguos ni la ruta `/admin/soporte` de server.js.
        Ambos paneles usaban el mismo motor (window.SoporteJS) y las mismas
        colecciones, así que no fue necesario migrar ningún dato.
    -->
    <meta http-equiv="refresh" content="0; url=../soporte.html?tab=staff">
    <link rel="icon" href="../../recursos/PSGD.png" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0; min-height: 100%; background: #0b1120; color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            text-align: center; padding: 2.2rem 2.6rem; border-radius: 18px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 176, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); max-width: 460px;
        }
        .card i { color: #00b0ff; font-size: 2.4rem; margin-bottom: .8rem; }
        h1 { font-size: 1.15rem; margin: 0 0 .5rem; color: #fff; }
        p { font-size: .88rem; line-height: 1.5; color: #94a3b8; margin: 0 0 1.2rem; }
        a {
            display: inline-block; padding: .7rem 1.2rem; border-radius: 10px;
            background: rgba(0, 176, 255, 0.15); border: 1px solid rgba(0, 176, 255, 0.45);
            color: #40c4ff; text-decoration: none; font-weight: 700; font-size: .85rem;
        }
    </style>
</head>
<body data-site-root="../.." data-theme="dark" class="dark-mode">
    <div class="card">
        <i class="fa-solid fa-headset" aria-hidden="true"></i>
        <h1>Panel de Soporte unificado</h1>
        <p>El panel de atención al staff ahora vive dentro del <strong>Centro de Soporte</strong>,
           junto a la creación de tickets. Redirigiendo…</p>
        <a href="../soporte.html?tab=staff"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i> Ir al Centro de Soporte</a>
    </div>
    <script>
        // Redirección inmediata; el enlace de arriba queda como respaldo.
        try { location.replace('../soporte.html?tab=staff'); } catch (e) {
            location.href = '../soporte.html?tab=staff';
        }
    </script>
</body>
</html>
